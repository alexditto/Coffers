<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Coffer logo</title>
  <desc id="desc">A white treasure chest centered on a rounded purple square.</desc>

  <defs>
    <linearGradient id="purple" x1="0" y1="0" x2="0.88" y2="1">
      <stop offset="0" stop-color="#7130ac"/>
      <stop offset="0.48" stop-color="#6425a0"/>
      <stop offset="1" stop-color="#58208e"/>
    </linearGradient>

    <radialGradient id="highlight" cx="50%" cy="24%" r="72%">
      <stop offset="0" stop-color="#a45adb" stop-opacity=".16"/>
      <stop offset=".58" stop-color="#7b36b9" stop-opacity=".04"/>
      <stop offset="1" stop-color="#351052" stop-opacity=".13"/>
    </radialGradient>

    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="13" flood-color="#34104f" flood-opacity=".22"/>
    </filter>

    <filter id="chest-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#35104f" flood-opacity=".19"/>
    </filter>
  </defs>

  <g filter="url(#soft-shadow)">
    <rect x="48" y="42" width="416" height="428" rx="94" fill="url(#purple)"/>
    <rect x="48" y="42" width="416" height="428" rx="94" fill="url(#highlight)"/>
  </g>

  <g fill="#fff" filter="url(#chest-shadow)">
    <path d="M145 226v-27c0-25 20-45 45-45h132c25 0 45 20 45 45v27h-86v-8c0-7-5-12-12-12h-26c-7 0-12 5-12 12v8z"/>
    <path d="M145 242h86v1c0 7 5 12 12 12h26c7 0 12-5 12-12v-1h86v65c0 25-20 45-45 45H190c-25 0-45-20-45-45z"/>
  </g>

  <rect x="231" y="206" width="50" height="49" rx="9" fill="url(#purple)"/>
</svg>
